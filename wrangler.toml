# xdeck — Cloudflare Workers + static assets (Vite build)
name = "xdeck"
main = "worker/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Serve the Vite SPA from the Worker (Workers Assets)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "xdeck-db"
database_id = "058562ed-e8c4-4cef-b462-79327df79ebe"
migrations_dir = "migrations"

# Optional KV for OAuth state / magic-link tokens (short-lived)
[[kv_namespaces]]
binding = "SESSIONS"
id = "0c413cfc98f1490ab2860dd42c425fe2"
preview_id = "0c413cfc98f1490ab2860dd42c425fe2"

# Empty list required to clear an existing Cloudflare cron (commenting out does not).
# Disables background keyword polls for X COGS; re-enable intentionally with e.g. "*/5 * * * *".
[triggers]
crons = []

[vars]
APP_NAME = "xdeck"
APP_URL = "https://xdeck.nickperez.workers.dev"
# DEMO_MODE is auto-enabled when X_CLIENT_ID is unset
PLAN_NAME = "starter"

# Secrets (set via `wrangler secret put` or .dev.vars for local):
# AUTH_SECRET
# TOKEN_ENCRYPTION_KEY
# X_CLIENT_ID
# X_CLIENT_SECRET
# (optional) RESEND_API_KEY for real magic-link email
